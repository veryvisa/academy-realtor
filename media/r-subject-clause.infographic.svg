<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1294" width="900" height="1294" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">合同写了验房和贷款条件，怎样解除才算数？</title>
<desc id="d">电话不算数。条件满足后，应以书面通知卖方移除条件（subject）；双方签字后合同就有约束力，买方要尽合理努力去满足条件。</desc>
<rect width="900" height="1294" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">条件条款要书面解除 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">合同写了验房和贷款条件，怎样解除才算数？</text>
<rect x="40" y="146" width="820" height="132" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">电话不算数。条件满足后，应以书面通知卖方移除条件（subject）；双方签字后</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">合同就有约束力，买方要尽合理努力去满足条件。</text>
<rect x="40" y="304" width="820" height="129" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="338" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">必须书面</text>
<circle cx="64" cy="367" r="3.2" fill="#2F5D8A"/>
<text x="76" y="372" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">BCFSA 买家指南：条件满足后应以书面通知卖方移除条件</text>
<circle cx="64" cy="398" r="3.2" fill="#2F5D8A"/>
<text x="76" y="404" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">电话里说已满足，不算解除</text>
<line x1="450" y1="435" x2="450" y2="462" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,459 L458,459 L450,471 Z" fill="#5B6B7F"/>
<text x="466" y="454" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">再看努力义务</text>
<rect x="40" y="473" width="820" height="129" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="507" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">条件不是逃生条款</text>
<circle cx="64" cy="536" r="3.2" fill="#B45309"/>
<text x="76" y="541" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">双方签字后合同就有约束力</text>
<circle cx="64" cy="568" r="3.2" fill="#B45309"/>
<text x="76" y="572" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">买方要尽合理努力去满足条件</text>
<line x1="450" y1="604" x2="450" y2="631" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,628 L458,628 L450,640 Z" fill="#5B6B7F"/>
<text x="466" y="623" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">再看单方放弃</text>
<rect x="40" y="642" width="820" height="192" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="676" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">单方放弃的三个前提</text>
<circle cx="64" cy="705" r="3.2" fill="#1A7F4B"/>
<text x="76" y="710" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">依《Law and Equity Act》第 54 条</text>
<circle cx="64" cy="736" r="3.2" fill="#1A7F4B"/>
<text x="76" y="742" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">条件只对该方有利</text>
<circle cx="64" cy="768" r="3.2" fill="#1A7F4B"/>
<text x="76" y="773" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">合同不靠该条件也能履行</text>
<circle cx="64" cy="800" r="3.2" fill="#1A7F4B"/>
<text x="76" y="804" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">并在约定期限前放弃</text>
<rect x="40" y="856" width="820" height="129" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="890" font-size="20" fill="#B42318" font-weight="700" text-anchor="start">满足不了怎么办</text>
<circle cx="64" cy="919" r="3.2" fill="#B42318"/>
<text x="76" y="924" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">尽了合理努力仍不能满足的，合同终止</text>
<circle cx="64" cy="950" r="3.2" fill="#B42318"/>
<text x="76" y="956" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">经纪行代管的定金，要双方签释放表才退</text>
<rect x="40" y="1007" width="820" height="98" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1041" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1070" r="3.2" fill="#B45309"/>
<text x="76" y="1075" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「电话里告诉对方条件已经满足就算解除了」：要以书面通知卖方移除条件，电话不算数。</text>
<line x1="40" y1="1130" x2="860" y2="1130" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1156" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1178" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Law and Equity Act [RSBC 1996] c.253 s.59</text>
<text x="40" y="1200" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Real Estate Services Act, SBC 2004 c.42</text>
<text x="40" y="1222" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Offers to Sellers</text>
<text x="40" y="1250" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">2026-11-09 依据讲解页与已核规则摘要制作；个案以官方原文与主管机构答复为准。</text>
</svg>
